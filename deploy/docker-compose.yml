# Development only. Not a production deployment reference.
name: queuelens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queuelens
      POSTGRES_PASSWORD: queuelens
      POSTGRES_DB: queuelens
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queuelens:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      QUEUELENS_POSTGRES_DSN: postgresql://queuelens:queuelens@postgres:5432/queuelens
      QUEUELENS_REDIS_URL: redis://redis:6379/0
      # The token is required and has no default. Set it in the environment
      # before starting the compose stack.
      QUEUELENS_ADMIN_TOKEN: ${QUEUELENS_ADMIN_TOKEN:-change-me-at-least-16-characters}
    ports:
      - "8081:8080"
