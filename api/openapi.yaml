openapi: 3.1.0
info:
  title: QueueLens API
  version: 0.1.0
  description: |
    Status: M4 implementation, unreleased. Only implemented paths appear here.
    Adding a path before implementing it is treated as a documentation bug.

    The collector and the query API share one bearer token. Every path that
    needs it returns 401 without a valid `Authorization: Bearer <token>`
    header.

    The ingest endpoint takes either a single event object or an array of
    events. The response reports what happened to each event: `accepted` and
    `dropped` are counts, `rejected` holds one entry per rejected event with
    the reason it was rejected.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /v1/dashboard/overview:
    get: &DashboardOverview
      summary: One broker queue page and selected retained attempt outcomes
      description: |
        M4 queries accept only the listed single-valued parameters (no duplicates),
        at most 12 KiB raw query and 4 KiB cursor. Pages default to 100/max 200;
        buffered responses cap at 2 MiB and reads at three seconds. Broker paging
        visits at most 10,000 views and materializes at most 201 candidates.
        C-order pages are live, not a snapshot across requests. Metric time is
        the selected producer-supplied timestamp in UTC [from, until), ending
        at the cursor evaluation tick. An unavailable rate is null, never zero.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/MetricWindow'
      responses: &DashboardResponses
        '200':
          description: Bounded data and retained-history/lag/clock limitations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/QueryUnavailable' }
  /v1/dashboard/queues:
    get: &DashboardQueues
      summary: Bounded C-order broker queue page
      description: Same M4 parameter, response, deadline and cursor bounds as overview. Preserves legacy /v1/queues.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses: *DashboardResponses
  /v1/dashboard/queue:
    get: &DashboardQueue
      summary: Optional broker view, selected-outcome metrics and one job page
      description: |
        Exact decoded-once UTF-8 queue identity; slashes, quotes, percent signs and
        reserved names are retained. A missing broker view does not remove retained
        job history. The queue is required; M4 bounds/cursor semantics apply.
      parameters:
        - $ref: '#/components/parameters/RequiredQueue'
        - $ref: '#/components/parameters/ObservedState'
        - $ref: '#/components/parameters/MetricWindow'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses: *DashboardResponses
  /v1/dashboard/jobs:
    get: &DashboardJobs
      summary: Bounded retained jobs across all or one exact queue
      description: Selected state of the highest observed attempt. Pruning runs are omitted. M4 bounds apply.
      parameters:
        - $ref: '#/components/parameters/JobQueue'
        - $ref: '#/components/parameters/ObservedState'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses: *DashboardResponses
  /v1/dashboard/job:
    get: &DashboardJob
      summary: Retained run and separately paginated selected attempt summaries
      description: |
        Queue and job_id are exact decoded-once UTF-8 identifiers, each max 256
        bytes and nonblank. Attempts order numerically; the signed cursor also binds
        job identity. Run and attempts share a read-only REPEATABLE READ snapshot
        within this request. Pruning serves no partial attempts. A tombstone or no
        retained history never establishes absence of the production job. Durations
        are supplied, retry_exhausted stays null, and M3 evidence/limits remain.
      parameters:
        - $ref: '#/components/parameters/RequiredQueue'
        - name: job_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
          description: Exact nonblank job ID, max 256 UTF-8 bytes
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses: *DashboardResponses
  /dashboard/api/overview:
    get:
      <<: *DashboardOverview
      security: [{ dashboardSession: [] }]
      description: Same overview handler/bounds via an opt-in read-only same-origin browser session. No bearer proxy.
      responses: &BrowserDashboardResponses
        <<: *DashboardResponses
        '401': { description: Missing, revoked or expired dashboard session }
        '403': { description: Configured host/origin rejected }
  /dashboard/api/queues:
    get:
      <<: *DashboardQueues
      security: [{ dashboardSession: [] }]
      responses: *BrowserDashboardResponses
  /dashboard/api/queue:
    get:
      <<: *DashboardQueue
      security: [{ dashboardSession: [] }]
      responses: *BrowserDashboardResponses
  /dashboard/api/jobs:
    get:
      <<: *DashboardJobs
      security: [{ dashboardSession: [] }]
      responses: *BrowserDashboardResponses
  /dashboard/api/job:
    get:
      <<: *DashboardJob
      security: [{ dashboardSession: [] }]
      responses: *BrowserDashboardResponses
  /dashboard/api/workers:
    get:
      summary: M3 worker page through the read-only browser session
      description: |
        Same receipt/tick and signed-cursor policy as /v1/workers; additionally
        rejects unknown/duplicate parameters, caps raw query at 12 KiB and response
        at 2 MiB. The wire status alive means recent receipt evidence, not proven life.
      security: [{ dashboardSession: [] }]
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: status
          in: query
          schema: { type: string, enum: [all, suspected_down], default: all }
      responses:
        '200':
          description: Bounded receipt evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerPage' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Configured host/origin rejected }
        '503': { $ref: '#/components/responses/QueryUnavailable' }
  /dashboard/session:
    get:
      summary: Browser authentication bootstrap and fixed expiry
      security: []
      description: |
        Opt-in dashboard paths return 404 when disabled. Host must match the exact
        configured origin; supplied Origin/Sec-Fetch-Site must be same-origin.
        No query parameters. Unauthenticated bootstrap is a 200 with authenticated=false.
      responses:
        '200':
          description: Session bootstrap, Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSession' }
        '403': { description: Host/origin or session query rejected }
    post:
      summary: Authenticate with the separate read-only dashboard password
      security: []
      description: |
        Exact configured Host and Origin required; no CORS. JSON only, 1 KiB body,
        password 12–256 bytes with constant-time SHA-256 comparison. Never use the
        shared ingest/admin token. Opaque random 256-bit sessions live four hours;
        max 256 sessions and 1,024 rate-limit clients, 20 attempts per 10 minutes.
        Cookies are HttpOnly/SameSite Strict/Path=/, Secure/__Host-queuelens_session
        for HTTPS, or queuelens_dev_session only with explicit HTTP loopback development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '200':
          description: Session issued with fixed expiry and no-store response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSession' }
        '400': { description: Invalid bounded JSON credentials }
        '401': { description: Incorrect dashboard password }
        '403': { description: Configured host/origin rejected }
        '415': { description: JSON content type required }
        '429': { description: Bounded client/attempt rate limit reached; Retry-After 600 }
        '503': { description: Session capacity or entropy unavailable }
    delete:
      summary: Revoke browser session and expire its cookie
      security: [{ dashboardSession: [] }]
      description: Exact configured host/origin required. Idempotent; restart also invalidates all sessions.
      responses:
        '204': { description: Session revoked, cookie expired }
        '403': { description: Configured host/origin rejected }
  /v1/jobs/failed:
    get:
      summary: Highest-attempt observed failures
      description: Failure does not prove retry exhaustion. Pages expose missing history and projection lag.
      parameters:
        - $ref: '#/components/parameters/JobQueue'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200': { $ref: '#/components/responses/JobPage' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/QueryUnavailable' }
  /v1/jobs/stalled:
    get:
      summary: Highest-attempt explicit stalled evidence
      description: Only observed stalled events; worker heartbeat absence does not establish a job stall.
      parameters:
        - $ref: '#/components/parameters/JobQueue'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200': { $ref: '#/components/responses/JobPage' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/QueryUnavailable' }
  /v1/jobs/suspected-stalled:
    get:
      summary: Unresolved jobs with no recent job event receipt
      description: |
        Enqueued/started/retried projections with no receipt for QUEUELENS_STALL_AFTER
        (default 15 minutes). Zero disables this view. Source state remains observed;
        suspicion has reason no_job_receipt and a threshold. Missing telemetry, long
        jobs and projection lag remain possible. No expected duration is inferred.
      parameters:
        - $ref: '#/components/parameters/JobQueue'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200': { $ref: '#/components/responses/JobPage' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/QueryUnavailable' }
  /v1/workers:
    get:
      summary: Paginated receipt-based worker liveness evidence
      description: |
        Suspected down at 60 seconds without a server receipt, evaluated on UTC
        ticks (default 5 seconds, configurable 1 second–1 minute). Detection is
        visible on the next query at an eligible tick; no background notification
        is promised. Future receipts remain alive with receipt age zero.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: status
          in: query
          schema: { type: string, enum: [all, suspected_down], default: all }
      responses:
        '200':
          description: Worker evidence at the cursor's fixed evaluation time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerPage' }
        '400': { $ref: '#/components/responses/InvalidPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/QueryUnavailable' }
  /v1/workers/heartbeat:
    post:
      summary: Persist worker liveness using collector receipt time
      description: One JSON object, at most 16 KiB. Unknown fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '202':
          description: Heartbeat persisted; first_seen is preserved and last_seen advances
        '400':
          description: Invalid heartbeat or body
        '401':
          description: Missing or invalid bearer token
        '503':
          description: Storage is unavailable or exceeded its two-second deadline
  /v1/events:
    post:
      summary: Ingest a batch of queue events
      description: |
        Accepts at most 1,000 events or 1 MiB per request. An event that
        fails validation is rejected on its own with a reason; the other
        events in the batch are still accepted.

        When the collector's buffer is full the events that do not fit are
        dropped and counted, and the response is 429 with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/Event'
            examples:
              oneEvent:
                value:
                  v: 1
                  ts: "2026-11-13T10:00:00.123Z"
                  queue: emails
                  job_id: "8891"
                  job_name: send-welcome
                  attempt: 2
                  state: failed
                  worker_id: w-7
                  duration_ms: 340
                  error: SMTP timeout
              batch:
                value:
                  - v: 1
                    ts: "2026-11-13T10:00:00.123Z"
                    queue: emails
                    job_id: "8891"
                    state: enqueued
      responses:
        '202':
          description: The events were accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: The body could not be read, or every event was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          description: Missing or invalid bearer token
        '429':
          description: The collector's buffer was full; some events were dropped
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
  /v1/queues:
    get:
      summary: List the queues the adapters know about
      description: |
        The state is the result of the last successful poll. When an adapter
        fails, the last known state is kept and every queue is marked
        `stale` with the error that was seen.
      responses:
        '200':
          description: The current queue state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuesResponse'
        '401':
          description: Missing or invalid bearer token
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
  /readyz:
    get:
      summary: Readiness check
      security: []
      description: |
        Returns 503 when the database cannot be reached. The broker is not
        part of this check: a broken broker must not take the collector out
        of rotation.
      responses:
        '200':
          description: The collector can serve traffic
        '503':
          description: The database is not reachable
  /metrics:
    get:
      summary: Collector counters in the Prometheus text format
      security: []
      description: |
        M1 exposes the collector's own counters only. The Go runtime and
        process metrics arrive with the full exporter in M5.
      responses:
        '200':
          description: The counters
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    RequiredQueue:
      name: queue
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
      description: Exact nonblank UTF-8 queue identifier, max 256 bytes
    ObservedState:
      name: state
      in: query
      schema: { type: string, enum: [all, enqueued, started, completed, failed, retried, stalled], default: all }
    MetricWindow:
      name: window
      in: query
      schema: { type: string, enum: [1h, 24h, 7d, 30d], default: 1h }
    JobQueue:
      name: queue
      in: query
      description: Optional exact queue filter, at most 256 UTF-8 bytes
      schema: { type: string, minLength: 1, maxLength: 256 }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    PageCursor:
      name: cursor
      in: query
      description: |
        Opaque signed keyset cursor bound to route, filter and evaluation time.
        Jobs order by queue/job ID, workers by worker ID, using C collation.
        This is a live list: concurrent changes can alter membership between pages.
        Changing the admin token invalidates cursors.
      schema: { type: string, maxLength: 4096 }
  responses:
    JobPage:
      description: Bounded observed evidence with live-row consistency and history limitations
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobPage' }
    InvalidPage:
      description: Invalid limit, filter, cursor or cursor scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueryError' }
    Unauthorized:
      description: Missing or invalid bearer token
    QueryUnavailable:
      description: Query storage unavailable or finite deadline exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueryError' }
  securitySchemes:
    dashboardSession:
      type: apiKey
      in: cookie
      name: __Host-queuelens_session
      description: Separate read-only browser session; explicit HTTP loopback development uses queuelens_dev_session.
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    DashboardSession:
      type: object
      required: [authenticated, expires_at]
      properties:
        authenticated: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time }
    SelectedMetrics:
      type: object
      required: [available, window, from, until, source, completed, failed, conflicting, completions_per_second, failure_fraction, limitations]
      description: |
        Indexed selected-summary cache only; excludes pruning runs. Completion
        throughput is completed attempts / window seconds; failure fraction is
        failed / (failed+completed), null for an empty denominator. Superseded
        retry failures are not all failure events. Work caps at 500,000 terminal
        rows plus one sentinel and 150ms. Missing cache, deadline, overflow or
        window beyond configured receipt-history coverage gives unavailable/null.
        Retention, late facts, telemetry loss, contradictions and supplied clock
        disagreement limit interpretation. M5 hourly rollups/percentiles are absent.
      properties:
        available: { type: boolean }
        reason: { type: string, enum: [aggregation_unavailable, outside_history_coverage, missing_selected_cache, terminal_work_limit] }
        window: { type: string, enum: [1h, 24h, 7d, 30d] }
        from: { type: string, format: date-time }
        until: { type: string, format: date-time }
        source: { type: string, const: retained_selected_attempt_outcomes }
        completed: { type: [integer, 'null'], minimum: 0, maximum: 500000 }
        failed: { type: [integer, 'null'], minimum: 0, maximum: 500000 }
        conflicting: { type: [integer, 'null'], minimum: 0, maximum: 500000 }
        completions_per_second: { type: [number, 'null'], minimum: 0 }
        failure_fraction: { type: [number, 'null'], minimum: 0, maximum: 1 }
        limitations: { type: array, items: { type: string } }
    DashboardQueuePage:
      type: object
      required: [items, adapter_errors, source]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Queue' } }
        next_cursor: { type: string, maxLength: 4096 }
        adapter_errors: { type: object, maxProperties: 64, additionalProperties: { type: string } }
        source: { type: string, const: last_broker_poll }
    DashboardJobPage:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/JobItem' } }
        next_cursor: { type: string, maxLength: 4096 }
    DashboardJobDetail:
      type: object
      required: [queue, job_id, availability, summary, attempts, pruned_at]
      properties:
        queue: { type: string }
        job_id: { type: string }
        availability: { type: string, enum: [observed, pruning, pruned, not_observed] }
        summary: { anyOf: [{ $ref: '#/components/schemas/JobItem' }, { type: 'null' }] }
        attempts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/JobItem' } }
        next_cursor: { type: string, maxLength: 4096 }
        pruned_at: { type: [string, 'null'], format: date-time }
    DashboardResponse:
      allOf:
        - $ref: '#/components/schemas/PageEvidence'
        - type: object
          properties:
            queues: { $ref: '#/components/schemas/DashboardQueuePage' }
            broker: { $ref: '#/components/schemas/Queue' }
            metrics: { $ref: '#/components/schemas/SelectedMetrics' }
            jobs: { $ref: '#/components/schemas/DashboardJobPage' }
            job: { $ref: '#/components/schemas/DashboardJobDetail' }
    QueryError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ProjectionLag:
      type: object
      required: [known, pending_rows, pending_rows_lower_bound, sample_limit, sample_capped,
        oldest_pending_receipt, lag_seconds, pruning_runs_lower_bound, pruning_sample_capped,
        last_batch_at, last_scan_at]
      description: |
        At most 1,000 committed pending receipts and 1,000 pruning keys are read in
        a bounded consistent transaction. Capped samples are lower bounds, not exact
        counts. Unknown/timed-out evidence has known=false and nullable measurements;
        its zero lower bounds do not establish that work is complete.
      properties:
        known: { type: boolean }
        pending_rows: { type: [integer, 'null'], minimum: 0 }
        pending_rows_lower_bound: { type: integer, minimum: 0, maximum: 1000 }
        sample_limit: { type: integer, const: 1000 }
        sample_capped: { type: boolean }
        oldest_pending_receipt: { type: [string, 'null'], format: date-time }
        lag_seconds: { type: [number, 'null'], minimum: 0 }
        pruning_runs_lower_bound: { type: integer, minimum: 0, maximum: 1000 }
        pruning_sample_capped: { type: boolean }
        last_batch_at: { type: [string, 'null'], format: date-time }
        last_scan_at: { type: [string, 'null'], format: date-time }
        reason: { type: string }
    PageEvidence:
      type: object
      required: [evaluated_at, history_from, projection_lag, consistency, limitations]
      properties:
        evaluated_at: { type: string, format: date-time }
        history_from:
          type: string
          format: date-time
          description: Evaluation time minus configured receipt history window
        projection_lag: { $ref: '#/components/schemas/ProjectionLag' }
        consistency: { type: string, const: live_row_keyset }
        limitations:
          type: array
          items: { type: string }
    HistoryEvidence:
      type: object
      required: [complete_history, missing_enqueued, missing_started, missing_terminal,
        legacy_identity, missing_identity, pruned_history, conflicting_terminal,
        possible_job_id_reuse_or_clock_disagreement, incomplete_attempts]
      properties:
        complete_history: { type: boolean, const: false }
        missing_enqueued: { type: boolean }
        missing_started: { type: boolean }
        missing_terminal: { type: boolean }
        legacy_identity: { type: boolean }
        missing_identity: { type: boolean }
        pruned_history: { type: boolean }
        conflicting_terminal: { type: boolean }
        possible_job_id_reuse_or_clock_disagreement: { type: boolean }
        incomplete_attempts: { type: integer, minimum: 0 }
    Suspicion:
      type: object
      required: [reason, threshold_seconds]
      properties:
        reason: { type: string, enum: [no_job_receipt, no_worker_receipt] }
        threshold_seconds: { type: number, minimum: 0 }
    JobItem:
      type: object
      required: [queue, job_id, attempt, observed_attempts, state, state_evidence, state_at,
        source_states, enqueued_at, started_at, duration_ms, duration_kind,
        first_event_at, last_event_at, first_receipt_at, last_receipt_at,
        retry_exhausted, history, suspicion]
      properties:
        queue: { type: string }
        job_id: { type: string }
        job_name: { type: string }
        worker_id: { type: string }
        attempt: { type: integer, minimum: 1, maximum: 32767 }
        observed_attempts: { type: integer, minimum: 1, maximum: 32767 }
        state: { type: string, enum: [enqueued, started, completed, failed, retried, stalled] }
        state_evidence: { type: string, const: observed }
        state_at: { type: string, format: date-time }
        source_states:
          type: array
          uniqueItems: true
          description: Observed states of the selected reported attempt
          items: { type: string, enum: [enqueued, started, completed, failed, retried, stalled] }
        enqueued_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        duration_ms:
          type: [integer, 'null']
          minimum: 0
          description: Selected completed/failed event's supplied attempt duration; never timestamp subtraction
        duration_kind: { type: string, enum: [unknown, producer_reported_attempt] }
        error: { type: string }
        first_event_at: { type: string, format: date-time }
        last_event_at: { type: string, format: date-time }
        first_receipt_at: { type: string, format: date-time }
        last_receipt_at: { type: string, format: date-time }
        retry_exhausted: { type: 'null', description: Protocol v1 has no retry-exhaustion evidence }
        history: { $ref: '#/components/schemas/HistoryEvidence' }
        suspicion:
          anyOf: [{ $ref: '#/components/schemas/Suspicion' }, { type: 'null' }]
    JobPage:
      allOf:
        - $ref: '#/components/schemas/PageEvidence'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              maxItems: 200
              items: { $ref: '#/components/schemas/JobItem' }
            next_cursor: { type: string, maxLength: 4096 }
    WorkerItem:
      type: object
      required: [worker_id, pool, first_seen, last_seen, receipt_age_seconds, status, suspicion]
      properties:
        worker_id: { type: string }
        pool: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        receipt_age_seconds: { type: number, minimum: 0 }
        status: { type: string, enum: [alive, suspected_down] }
        suspicion:
          anyOf: [{ $ref: '#/components/schemas/Suspicion' }, { type: 'null' }]
    WorkerPage:
      allOf:
        - $ref: '#/components/schemas/PageEvidence'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              maxItems: 200
              items: { $ref: '#/components/schemas/WorkerItem' }
            next_cursor: { type: string, maxLength: 4096 }
    Heartbeat:
      type: object
      required: [v, worker_id]
      properties:
        v:
          type: integer
          const: 1
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Identity bounded to 128 UTF-8 bytes by the collector
        pool:
          type: string
          maxLength: 128
      additionalProperties: true
    Event:
      type: object
      required: [v, ts, queue, job_id, state]
      properties:
        v:
          type: integer
          const: 1
          description: The protocol version. Only 1 is accepted.
        id:
          type: string
          description: |
            Optional producer identity, scoped to queue. Omission stays unknown.
            Identical retained identities are storage no-ops; different normalized
            content under one identity rolls back the asynchronous storage batch.
            HTTP acceptance describes buffering, not database durability.
        ts:
          type: string
          format: date-time
          description: |
            When the event happened. Events older than 7 days are rejected and
            counted separately; events more than 1 hour in the future are
            rejected as clock skew.
        queue:
          type: string
          maxLength: 256
        job_id:
          type: string
          maxLength: 256
        job_name:
          type: string
          maxLength: 256
        attempt:
          type: integer
          minimum: 1
          default: 1
        state:
          type: string
          enum: [enqueued, started, completed, failed, retried, stalled, drained]
        worker_id:
          type: string
          maxLength: 128
        duration_ms:
          type: integer
          minimum: 0
          maximum: 2147483647
        error:
          type: string
          maxLength: 1024
          description: |
            The failure message. The collector truncates it and redacts
            common credential shapes on a best-effort basis.
      additionalProperties: true
      description: Unknown fields are ignored, so a newer adapter does not break an older collector.
    Rejection:
      type: object
      required: [index, reason]
      properties:
        index:
          type: integer
          description: The position of the event in the submitted batch
        id:
          type: string
        reason:
          type: string
    IngestResponse:
      type: object
      required: [accepted, dropped, rejected]
      properties:
        accepted:
          type: integer
          description: How many events were accepted into the buffer
        dropped:
          type: integer
          description: How many events were dropped because the buffer was full
        rejected:
          type: array
          description: One entry per rejected event
          items:
            $ref: '#/components/schemas/Rejection'
    Queue:
      type: object
      required: [queue, waiting, active, completed, failed, delayed, paused, prioritized, depth, updated_at, stale]
      properties:
        queue:
          type: string
        waiting:
          type: integer
        active:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        delayed:
          type: integer
        paused:
          type: integer
        prioritized:
          type: integer
        depth:
          type: integer
          description: waiting + delayed + paused + prioritized
        updated_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: True when the last poll of this adapter failed
        error:
          type: string
          description: The error of the failed poll, when there was one
    QueuesResponse:
      type: object
      required: [generated_at, queues]
      properties:
        generated_at:
          type: string
          format: date-time
        queues:
          type: array
          items:
            $ref: '#/components/schemas/Queue'
        adapter_errors:
          type: object
          additionalProperties:
            type: string
          description: The last error of every adapter that failed
